  cables.forEach(([a,b])=>{h+=path(a,b,'cs')});cables.forEach(([a,b])=>h+=path(a,b,'cab',COL[a.replace(/\d+|L|R/g,'')]));
  svg.innerHTML=h;
  const used=new Set(cables.flat());
  for(const id in jacks){jacks[id].classList.toggle('on',used.has(id));jacks[id].classList.toggle('sel',id==selS)}
}
